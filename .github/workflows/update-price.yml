name: Cập nhật giá SJC
on:
  schedule:
    - cron: "*/30 0-12 * * *"   # mỗi 30 phút, 7h-19h giờ Việt Nam
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_price.py
      - name: Lưu nếu có thay đổi
        run: |
          if [ -n "$(git status --porcelain prices.json)" ]; then
            git config user.name "giá-bot"; git config user.email "bot@users.noreply.github.com"
            git add prices.json; git commit -m "Cập nhật giá SJC"; git push
          fi
