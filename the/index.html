<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thẻ tín dụng">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#F2F3F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1318" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Thẻ tín dụng</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><h1 id="screenTitle">Tổng quan</h1><span class="feedstat" id="todayStat"></span></header>
<main>
  <section class="tab" id="tab-home"><div id="homeBody"></div></section>
  <section class="tab" id="tab-cards" hidden>
    <div class="row"><h2>Các thẻ</h2><button type="button" class="btn small" data-act="addcard">Thêm thẻ</button></div>
    <div id="cardsBody"></div>
  </section>
  <section class="tab" id="tab-tx" hidden>
    <div class="card"><h3>Dán tin nhắn ngân hàng</h3>
      <p class="note">Chép tin nhắn "phát sinh giao dịch" từ ứng dụng Tin nhắn, dán vào đây, app tự tách số tiền, ngày và nơi chi.</p>
      <div class="field"><label for="smsText">Nội dung tin nhắn</label><textarea id="smsText" placeholder="Dán tin nhắn vào đây" spellcheck="false"></textarea></div>
      <button type="button" class="btn" data-act="parsesms">Tách thông tin</button>
    </div>
    <div class="row"><h2>Giao dịch</h2><button type="button" class="btn small" data-act="addtx">Thêm tay</button></div>
    <div class="field"><label for="txCard">Lọc theo thẻ</label><select id="txCard"></select></div>
    <div id="txBody"></div>
  </section>
  <section class="tab" id="tab-rem" hidden><div id="remBody"></div></section>
  <section class="tab" id="tab-set" hidden><div id="setBody"></div></section>
</main>
<nav class="tabbar" role="tablist" aria-label="Màn hình"><div class="in">
  <button type="button" role="tab" data-tab="home" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Tổng quan</button>
  <button type="button" role="tab" data-tab="cards" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M7 15h3"/></svg>Thẻ</button>
  <button type="button" role="tab" data-tab="tx" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Chi tiêu</button>
  <button type="button" role="tab" data-tab="rem" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7M10 20a2 2 0 0 0 4 0"/></svg>Nhắc</button>
  <button type="button" role="tab" data-tab="set" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>Cài đặt</button>
</div></nav>
<dialog id="dlg" aria-label="Chi tiết"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="cards.js"></script>
<script src="app.js"></script>
</body>
</html>
